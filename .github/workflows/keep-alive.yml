name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://ecowatt-backend.onrender.com/)
          echo "Status: $status"
